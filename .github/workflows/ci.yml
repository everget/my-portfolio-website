name: CI + Deploy

on:
    push:
        branches: ['main']
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:

env:
    HUSKY: 0

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # --------------------------------------------------------------------------
    # CHECK
    # --------------------------------------------------------------------------
    check:
        name: Check (types + format + lint)
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup

            - run: pnpm install --frozen-lockfile
            - run: pnpm run ci:check

    # --------------------------------------------------------------------------
    # UNIT TESTS
    # --------------------------------------------------------------------------
    unit-test:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: [check]
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup

            - run: pnpm install --frozen-lockfile
            - run: pnpm run ci:test:unit

    # --------------------------------------------------------------------------
    # E2E TESTS
    # --------------------------------------------------------------------------
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        needs: unit-test
        timeout-minutes: 60
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup

            - run: pnpm install --frozen-lockfile

            - name: Read installed Playwright version
              id: playwright-version
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            # Only chromium is used (see playwright.config.ts), so only its deps are installed -
            # fewer apt packages means less exposure to flaky mirror timeouts.
            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install --with-deps chromium
              timeout-minutes: 8

            - name: Install Playwright OS dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium
              timeout-minutes: 8

            - name: Run E2E tests
              run: pnpm run ci:test:e2e

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report
                  path: tests/e2e/report/
                  retention-days: 30

    # --------------------------------------------------------------------------
    # DEPLOY
    # --------------------------------------------------------------------------
    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-latest
        needs: e2e
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: true
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup

            - run: pnpm install --frozen-lockfile
            - run: pnpm run ci:build

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

            - id: deployment
              uses: actions/deploy-pages@v5
